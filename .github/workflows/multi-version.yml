name: Multi-version build and tests

on:
  push:
    branches:
      - multi-version
      - codex/named-movie-versions
      - pinned-versions
      - plex-editions
  pull_request:
    branches:
      - multi-version
      - develop
  workflow_dispatch:

permissions:
  contents: read

jobs:
  backend:
    name: Backend Release tests, Debug regressions and startup
    runs-on: ubuntu-latest
    timeout-minutes: 90
    steps:
      - name: Check out
        uses: actions/checkout@v4

      - name: Set up .NET
        uses: actions/setup-dotnet@v4
        with:
          global-json-file: global.json

      - name: Build
        run: dotnet build src/Radarr.sln -c Release -p:Platform=Posix

      - name: Release startup smoke test
        run: python3 .github/scripts/smoke-startup.py _output/net10.0

      - name: Unit tests
        id: tests
        continue-on-error: true
        env:
          RADARR_TESTS_LOG_OUTPUT: File
        run: |
          mkdir -p ~/.config/Radarr
          FILTER="Category!=ManualTest&Category!=WINDOWS&Category!=IntegrationTest&Category!=AutomationTest"
          ASSEMBLIES=()
          for name in Radarr.Core.Test Radarr.Api.Test Radarr.Common.Test Radarr.Host.Test; do
            dll=$(find _tests -name "$name.dll" -not -path "*/ref/*" | head -1)
            test -n "$dll" || { echo "Missing test assembly: $name"; exit 1; }
            ASSEMBLIES+=("$dll")
          done
          dotnet test "${ASSEMBLIES[@]}" --filter "$FILTER" --logger trx --results-directory TestResults/Release

      - name: Debug build
        run: dotnet build src/Radarr.sln -c Debug -p:Platform=Posix

      - name: Debug startup smoke test
        run: python3 .github/scripts/smoke-startup.py _output/net10.0

      - name: Debug version and container regression tests
        id: debug_tests
        continue-on-error: true
        env:
          RADARR_TESTS_LOG_OUTPUT: File
        run: |
          # The full suite runs in Release, matching upstream. Debug additionally checks version behavior and host wiring.
          FILTER="Category!=ManualTest&Category!=WINDOWS&Category!=IntegrationTest&Category!=AutomationTest"
          VERSION_FILTER="FullyQualifiedName~MovieVersion|FullyQualifiedName~Versions|FullyQualifiedName~DownloadDecisionMaker|FullyQualifiedName~PendingReleaseServiceTests|FullyQualifiedName~DiskScanServiceTests|FullyQualifiedName~ImportApprovedMoviesFixture|FullyQualifiedName~ManualImportServiceFixture|FullyQualifiedName~NzbDrone.App.Test|FullyQualifiedName~NzbDrone.Host.Test|FullyQualifiedName~NzbDrone.Api.Test|FullyQualifiedName~PlexVersionLabel|FullyQualifiedName~extra_version_naming|FullyQualifiedName~plex_version_labels|FullyQualifiedName~plex_version_label_servers"
          ASSEMBLIES=()
          for name in Radarr.Core.Test Radarr.Api.Test Radarr.Host.Test; do
            dll=$(find _tests -name "$name.dll" -not -path "*/ref/*" | head -1)
            test -n "$dll" || { echo "Missing test assembly: $name"; exit 1; }
            ASSEMBLIES+=("$dll")
          done
          dotnet test "${ASSEMBLIES[@]}" --filter "$FILTER&($VERSION_FILTER)" --logger trx --results-directory TestResults/Debug

      - name: Report failed tests
        if: always()
        run: python3 .github/scripts/report-test-failures.py TestResults

      - name: Fail when tests failed
        if: always() && (steps.tests.outcome == 'failure' || steps.debug_tests.outcome == 'failure')
        run: exit 1

      - name: Upload test results
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: backend-test-results
          path: |
            TestResults
            TestLog.txt
          if-no-files-found: ignore

  frontend:
    name: Frontend lint and build
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - name: Check out
        uses: actions/checkout@v4

      - name: Set up Node
        uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: yarn

      - name: Install
        run: yarn install --frozen-lockfile --network-timeout 120000

      - name: Lint
        run: yarn lint

      - name: Stylelint
        run: yarn stylelint-linux

      - name: Build (includes TypeScript checks)
        run: yarn run build --env production

  windows-package:
    name: Windows x64 package
    # A runnable Radarr for Windows (backend and UI) to try the pinned-versions or plex-editions branch on a PC
    if: github.event_name == 'workflow_dispatch' || github.ref == 'refs/heads/pinned-versions' || github.ref == 'refs/heads/plex-editions'
    runs-on: windows-latest
    timeout-minutes: 90
    steps:
      - name: Check out
        uses: actions/checkout@v4

      - name: Set up .NET
        uses: actions/setup-dotnet@v4
        with:
          global-json-file: global.json

      - name: Set up Node
        uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: yarn

      - name: Build backend
        shell: bash
        run: ./build.sh --backend -r win-x64 -f net10.0

      - name: Build UI
        shell: bash
        run: ./build.sh --frontend

      - name: Create package
        shell: bash
        run: ./build.sh --packages -r win-x64 -f net10.0

      - name: Check package
        shell: bash
        run: |
          test -f _artifacts/win-x64/net10.0/Radarr/Radarr.exe
          test -f _artifacts/win-x64/net10.0/Radarr/UI/index.html
          ls _artifacts/win-x64/net10.0/Radarr | head -50

      - name: Upload package
        uses: actions/upload-artifact@v4
        with:
          name: ${{ github.ref == 'refs/heads/plex-editions' && 'Radarr-plex-editions-windows-x64' || 'Radarr-pinned-versions-windows-x64' }}
          path: _artifacts/win-x64/net10.0
          retention-days: 30
